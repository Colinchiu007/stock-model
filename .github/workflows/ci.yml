name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
      - name: Ruff check
        run: ruff check src/ tests/ || true
      - name: Ruff format check
        run: ruff format --check src/ tests/ || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,quant]"
          # pandas-ta requires Python >=3.12
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pip install pandas-ta 2>/dev/null || true
          fi
          # ta-lib requires C library
          sudo apt-get update -qq && sudo apt-get install -y -qq libta-lib0-dev 2>/dev/null || true
          pip install ta-lib 2>/dev/null || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=stock_model --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test-optional:
    name: Test Optional Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all optional dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,quant,schedule,web,ta]"
          # ta-lib C library
          sudo apt-get update -qq && sudo apt-get install -y -qq libta-lib0-dev 2>/dev/null || true
          pip install ta-lib 2>/dev/null || true

      - name: Run tests with optional deps
        run: |
          pytest tests/ -v --tb=short

      - name: Verify web dashboard import
        run: |
          python -c "from stock_model.web import create_app; print('Web dashboard OK')"

      - name: Verify portfolio optimizer import
        run: |
          python -c "from stock_model.portfolio import PortfolioOptimizer; print('Portfolio optimizer OK')"

      - name: Verify RL agent import
        run: |
          python -c "from stock_model.strategy import RLTradingAgent; print('RL agent OK')"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install --upgrade pip build
          python -m build
      - name: Check package
        run: |
          pip install twine
          twine check dist/*