name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          # ruff **必须锁版本**: 不锁则 CI 每次装最新, 本地是另一版本 ->
          # 两边规则不同, 出现"本地全绿、CI 报错"的反复返工。
          # 实测(2026-10-24): 本地 0.17.1 漏过 F841(未用变量), CI 装 0.17.2 抓到。
          # 升级 ruff 请同时改这里与本地环境, 并跑一次全量门禁。
          pip install "ruff==0.17.2" mypy
          # mypy 必须**看到依赖**才能真的检查代码: 缺依赖时它只会报一堆
          # "Cannot find implementation or library stub", 看着跑了其实没查。
          # 这里装上与主测试 job 一致的一组(rl / ta 两个 extra 除外 ——
          # 那两类在 pyproject 的 [[tool.mypy.overrides]] 里点名豁免)。
          # e2e extra: mypy 门禁覆盖 tests/ 后需要 playwright 的类型存根
          # (test_frontend_e2e.py 导入 playwright.sync_api) —— 2026-10-14。
          pip install -e ".[dev,quant,schedule,web,e2e]"
      - name: Ruff check
        run: ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/
      - name: Mypy check
        # 历史上 CI 只 pip install mypy 却从不执行它, 存量 86 个错误无人可见。
        # 注意不要加 `|| true`: 失败必须让 CI 红。
        # 2026-10-13: scripts/ 曾不在 ruff/mypy 覆盖范围内 —— 盲区里躺着
        # 12 个 ruff 违规 + 9 个 mypy 错误(含 2 个潜在真 bug: Popen|None
        # 解引用、ping() 缺 return)。三个门禁现在都覆盖 scripts/。
        # 2026-10-14: tests/ 的 7 个 mypy 历史错误(no-any-return/cast)已清，
        # mypy 覆盖扩展到 tests/ —— src/scripts/tests 三个目录全在门禁内。
        run: mypy src/stock_model scripts/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,quant]"
          # pandas-ta requires Python >=3.12
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pip install pandas-ta 2>/dev/null || true
          fi
          # ta-lib requires C library
          sudo apt-get update -qq && sudo apt-get install -y -qq libta-lib0-dev 2>/dev/null || true
          pip install ta-lib 2>/dev/null || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=stock_model --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test-optional:
    name: Test Optional Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all optional dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,quant,schedule,web,ta]"
          # ta-lib C library
          sudo apt-get update -qq && sudo apt-get install -y -qq libta-lib0-dev 2>/dev/null || true
          pip install ta-lib 2>/dev/null || true

      - name: Run tests with optional deps
        run: |
          pytest tests/ -v --tb=short

      - name: Verify web dashboard import
        run: |
          python -c "from stock_model.web import create_app; print('Web dashboard OK')"

      - name: Verify portfolio optimizer import
        run: |
          python -c "from stock_model.portfolio import PortfolioOptimizer; print('Portfolio optimizer OK')"

      - name: Verify RL agent import
        run: |
          python -c "from stock_model.strategy import RLTradingAgent; print('RL agent OK')"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install --upgrade pip build
          python -m build
      - name: Check package
        run: |
          pip install twine
          twine check dist/*