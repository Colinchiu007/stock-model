[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-model"
version = "0.1.0"
description = "股票分析与投资模型 - 第一期手动分析，后期自动量化Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stock Model Team"}
]

dependencies = [
    # 数据获取与处理
    "akshare>=1.12.0",
    "baostock>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # 可视化
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "kaleido>=0.2.1",
    
    # 配置管理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    
    # 工具
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ta = [
    # 技术分析(可选: pandas-ta需要Python>=3.12, ta-lib需要C库)
    "pandas-ta>=0.3.14b",
    "ta-lib>=0.4.28",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

quant = [
    # 第二期量化Agent依赖
    "scipy>=1.11.0",
]

schedule = [
    # 定时任务
    "apscheduler>=3.10.0",
]

web = [
    # Web Dashboard
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

rl = [
    # 强化学习(可选)
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM", "RUF", "PERF", "PLR", "PLW", "FURB", "NPY", "PD", "DTZ", "TC"]
ignore = ["ERA001", "PLR2004", "PLR0913", "PLR0912", "PLR0915", "PLC0415", "RUF012", "PLR6301", "RUF001", "RUF002", "RUF003", "DTZ005", "PD011", "PD003", "PERF203", "A002", "A001", "PLR0917", "PLW0603", "NPY002", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"src/stock_model/web/app.py" = ["E501"]  # HTML template with inline CSS
"tests/*" = ["NPY002", "RUF059", "N806"]  # numpy random, unused unpack, Mock naming in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"