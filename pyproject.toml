[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-model"
version = "0.5.0"
description = "股票分析与投资模型 - 第一期手动分析，后期自动量化Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stock Model Team"}
]

dependencies = [
    # 数据获取与处理
    "akshare>=1.12.0",
    "baostock>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # 可视化
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "kaleido>=0.2.1",
    
    # 配置管理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    
    # 工具
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ta = [
    # 技术分析(可选: pandas-ta需要Python>=3.12, ta-lib需要C库)
    "pandas-ta>=0.3.14b",
    "ta-lib>=0.4.28",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

quant = [
    # 第二期量化Agent依赖
    "scipy>=1.11.0",
]

schedule = [
    # 定时任务
    "apscheduler>=3.10.0",
]

web = [
    # Web Dashboard
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

rl = [
    # 强化学习(可选)
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Web 前端资源必须随包安装, 否则 pip 安装后 static/ 丢失导致仪表盘 404
"stock_model.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM", "RUF", "PERF", "PLR", "PLW", "FURB", "NPY", "PD", "DTZ", "TC"]
ignore = ["ERA001", "PLR2004", "PLR0913", "PLR0912", "PLR0915", "PLC0415", "RUF012", "PLR6301", "RUF001", "RUF002", "RUF003", "DTZ005", "PD011", "PD003", "PERF203", "A002", "A001", "PLR0917", "PLW0603", "NPY002", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"src/stock_model/web/app.py" = ["E501"]  # HTML template with inline CSS
"tests/*" = ["NPY002", "RUF059", "N806", "N803", "N817", "SIM117"]  # numpy random, unused unpack, Mock naming in tests; SIM117: 嵌套 with 比合并更易读

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

# ---- 无类型信息的依赖：**点名**豁免，不用全局 ignore_missing_imports ----
#
# 历史上这段配置从来没被执行过（CI 装了 mypy 却只跑 ruff），存量 86 个错误
# 无人可见。现在既然接进 CI，就必须把「哪些依赖查不了」写清楚。
#
# 为什么不写一行 `ignore_missing_imports = true` 了事：
# 全局忽略会让**新引入一个无类型依赖**这件事彻底不可见；点名豁免则保证
# 新依赖冒出来时 mypy 会报错，逼人做一次决定（补 stub，或登记到这张表里）。
# tests/test_quality_gates.py 锁住了这一点。
#
# 下面三项分类依据是实测（包目录下有无 py.typed / 是否装得上），不是猜的：
#   1) 上游没有 py.typed、PyPI 也无官方 stub —— 只能豁免
#   2) 有官方 stub 包但未安装（装 types-* 即可收紧，属后续优化，不在本次范围）
#   3) CI 不装的可选依赖（rl / ta extra）—— 由 tests 用 importorskip 兜住
#
# ⚠️ 一个容易误判的点：``ignore_missing_imports`` 只豁免「**缺少**类型信息」，
# **不**豁免「类型信息在场时的真实错误」。所以同一个 mypy 命令在不同依赖环境下
# 结果可能不同 —— 实测踩过：本地 requests 无 py.typed(不打补丁代码不报错)，
# CI 的 requests 2.34+ 自带 py.typed，于是 fetcher.py 的 monkey-patch 被真检查、
# 多出 3 个错误。这类差异不是 bug，但意味着 **mypy 门禁以 CI 为准**。
[[tool.mypy.overrides]]
module = [
    # 1) 上游无类型信息
    "akshare.*",
    "baostock.*",
    "plotly.*",
    "apscheduler.*",
    "scipy.*",
    # 2) 有 stub 包但没装：pandas-stubs / types-PyYAML / types-requests
    "pandas.*",
    "yaml.*",
    "requests.*",
    # 3) CI 不安装的可选依赖
    "gymnasium.*",
    "stable_baselines3.*",
    "pandas_ta.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"